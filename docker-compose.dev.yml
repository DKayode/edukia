version: '3.8'

services:
  # Redis for BullMQ Queue
  redis:
    image: redis:7-alpine
    container_name: edukia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - edukia_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edukia_backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # Node
      NODE_ENV: development
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE}
      MAIL_NO_REPLY_FROM: ${MAIL_NO_REPLY_FROM:-}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Cloudflare R2 storage — used by the /files presign + proxy endpoints.
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET}
      R2_PUBLIC_BUCKET_URL: ${R2_PUBLIC_BUCKET_URL}
    volumes:
      - ./backend/config/firebase-serviceaccount.json:/app/config/firebase-serviceaccount.json:ro
    networks:
      - edukia_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/api', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', (e) => { process.exit(1); })"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # React Frontend Admin Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/backend
    container_name: edukia_frontend
    restart: unless-stopped
    networks:
      - edukia_network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80" ]
      interval: 30s
      timeout: 3s
      retries: 3

  # Nginx Reverse Proxy (Dev)
  nginx:
    image: nginx:alpine
    container_name: edukia_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - edukia_network
    depends_on:
      - frontend

networks:
  edukia_network:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
