services:
  # Redis for BullMQ Queue
  redis:
    image: redis:7-alpine
    container_name: edukia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - edukia_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  backend:
    image: ${DOCKER_IMAGE_BACKEND:-ghcr.io/dkayode/edukia-backend:latest}
    container_name: edukia_backend
    restart: unless-stopped
    environment:
      # Database — managed Postgres on Neon. Connection string carries
      # credentials, host, db name, and sslmode=require; the previous
      # DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD / DB_NAME variables
      # were leftovers from a local-db setup and are no longer read.
      DATABASE_URL: ${DATABASE_URL}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # Node
      NODE_ENV: production
      # Verrou des abonnements. Éteint, les refus (quota épuisé, abonnement
      # requis, profil incomplet) sont journalisés mais la ressource est servie
      # quand même — c'est la phase d'observation. Allumé, ils s'appliquent.
      # Comme ce service ne déclare pas env_file, l'oublier ici suffirait à
      # rendre la variable sans effet malgré sa présence dans .env.
      ABONNEMENTS_VERROU_ACTIF: ${ABONNEMENTS_VERROU_ACTIF:-false}
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE}
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # Cloudflare R2 storage — used by the /files presign + proxy endpoints.
      # The private bucket holds default content; the public one is used for
      # slots flagged `public: true` in the registry (categories.icone +
      # etablissements.logo) and is anonymously readable via R2_PUBLIC_BUCKET_URL.
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET}
      R2_PUBLIC_BUCKET_URL: ${R2_PUBLIC_BUCKET_URL}
      # Wallet / payments. PAYMENT_INTERNAL_API_KEY guards the internal
      # exam-reward credit endpoint — MUST be set: an empty value makes the
      # InternalApiKeyGuard fail open (see nginx: /internal/ is also blocked at
      # the edge as defense-in-depth).
      PAYMENT_INTERNAL_API_KEY: ${PAYMENT_INTERNAL_API_KEY}
      # Withdrawal OTP SMS via Infobip (replaced Twilio). INFOBIP_BASE_URL +
      # INFOBIP_API_KEY are REQUIRED — an empty value makes every OTP send throw
      # "Configuration Infobip incomplète". INFOBIP_WEBHOOK_SECRET secures the
      # delivery-report webhook (empty → the guard 403s all callbacks). The OTP_*
      # vars tune code generation/resend/hash; set OTP_DEBUG_ENABLED=false in prod.
      OTP_SMS_PROVIDER: ${OTP_SMS_PROVIDER}
      OTP_DEBUG_ENABLED: ${OTP_DEBUG_ENABLED}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES}
      OTP_LENGTH: ${OTP_LENGTH}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS}
      OTP_MAX_RESENDS: ${OTP_MAX_RESENDS}
      OTP_ANDROID_SMS_HASH: ${OTP_ANDROID_SMS_HASH}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY}
      INFOBIP_FROM: ${INFOBIP_FROM}
      INFOBIP_SMS_ENDPOINT: ${INFOBIP_SMS_ENDPOINT}
      INFOBIP_TIMEOUT_MS: ${INFOBIP_TIMEOUT_MS}
      INFOBIP_REPORTS_ENDPOINT: ${INFOBIP_REPORTS_ENDPOINT}
      INFOBIP_REMOVE_PLUS_FROM_TO: ${INFOBIP_REMOVE_PLUS_FROM_TO}
      INFOBIP_WEBHOOK_SECRET: ${INFOBIP_WEBHOOK_SECRET}
      INFOBIP_DELIVERY_REPORT_NOTIFY_URL: ${INFOBIP_DELIVERY_REPORT_NOTIFY_URL}
      INFOBIP_NOTIFY_CONTENT_TYPE: ${INFOBIP_NOTIFY_CONTENT_TYPE}
      # Kessiah — lecture automatique des épreuves. Ce service ne déclare pas
      # env_file : une variable absente de cette liste n'atteint jamais le
      # conteneur, même écrite dans .env. Les deux vont de pair, et l'une sans
      # l'autre désactive l'intégration en silence.
      KESSIAH_API_BASE_URL: ${KESSIAH_API_BASE_URL}
      KESSIAH_SERVICE_KEY: ${KESSIAH_SERVICE_KEY}
    networks:
      - edukia_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/api', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', (e) => { process.exit(1); })"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # React Frontend Admin Dashboard
  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-ghcr.io/dkayode/edukia-frontend:latest}
    container_name: edukia_frontend
    restart: unless-stopped
    networks:
      - edukia_network
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80" ]
      interval: 30s
      timeout: 3s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: edukia_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - edukia_network
    depends_on:
      - frontend
      - backend

  # Certbot
  certbot:
    image: certbot/certbot
    container_name: edukia_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c ' if [ ! -f /etc/letsencrypt/live/educ-prime.com/fullchain.pem ]; then
        certbot certonly --webroot --webroot-path=/var/www/certbot --email support@educ-prime.cloud --agree-tos --no-eff-email --reuse-key -d educ-prime.com -d api.educ-prime.com;
      fi; if [ ! -f /etc/letsencrypt/live/grafana.educ-prime.com/fullchain.pem ]; then
        certbot certonly --webroot --webroot-path=/var/www/certbot --email support@educ-prime.cloud --agree-tos --no-eff-email --reuse-key --cert-name grafana.educ-prime.com -d grafana.educ-prime.com;
      fi; trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done; '
    networks:
      - edukia_network

  # --- Observability: Vector -> Loki (R2 backend) -> Grafana ---
  loki:
    image: grafana/loki:3.3.2
    container_name: edukia_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
    environment:
      # Reuse the app's account-wide R2 credentials (they can reach edukia-logs).
      LOKI_R2_ENDPOINT: ${R2_ENDPOINT}
      LOKI_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      LOKI_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - edukia_network

  vector:
    image: timberio/vector:0.44.0-debian
    container_name: edukia_vector
    restart: unless-stopped
    # --watch-config so edits to vector.yaml auto-reload on deploy (compose does
    # not recreate a container when only a bind-mounted file's contents change).
    command: --watch-config --config-yaml /etc/vector/vector.yaml
    volumes:
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector
    depends_on:
      - loki
    networks:
      - edukia_network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: edukia_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.educ-prime.com
      GF_SERVER_DOMAIN: grafana.educ-prime.com
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Referenced by the Slack contact point provisioning ($__env{SLACK_WEBHOOK_URL}).
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - loki
    networks:
      - edukia_network

networks:
  edukia_network:
    driver: bridge

volumes:
  loki_data:
  vector_data:
  grafana_data:
