name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger
  # Une modification de ce seul fichier ne produit aucune image, donc aucun
  # workflow_run : sans ce déclencheur, un changement de configuration ne
  # partirait jamais en production. Le garde-fou ci-dessous évite l'autre
  # travers — déployer une image périmée quand du code accompagne le
  # changement.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'

jobs:
  # Un commit qui touche à la fois `deploy.yml` et du code déclenche DEUX
  # workflows en parallèle : la construction de l'image, et ce déploiement.
  # Le déploiement gagne la course et publie l'image PRÉCÉDENTE, avant d'être
  # suivi d'un second déploiement une fois l'image construite.
  #
  # Le premier s'affiche alors « réussi » sans avoir rien livré de neuf — et si
  # le second échoue, le tableau de bord reste au vert avec une production sur
  # l'ancien code. C'est arrivé le 19 août 2026.
  #
  # On laisse donc la main à la chaîne construction -> déploiement dès qu'un
  # fichier susceptible d'être construit a changé. Le travail s'affiche
  # « ignoré », pas « réussi » : la différence se voit d'un coup d'oeil.
  verifier-course:
    runs-on: ubuntu-latest
    outputs:
      deployer: ${{ steps.decision.outputs.deployer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decider s il faut deployer maintenant
        id: decision
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Declenche par ${{ github.event_name }} : deploiement normal."
            echo "deployer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODIFIES=$(git diff --name-only HEAD^ HEAD || echo '')
          echo "Fichiers modifies :"
          echo "$MODIFIES" | sed 's/^/  /'

          if echo "$MODIFIES" | grep -qE '^(backend|frontend)/'; then
            echo "::notice::Du code accompagne ce changement : une image est en construction. Le deploiement suivra sa reussite."
            echo "deployer=false" >> "$GITHUB_OUTPUT"
          else
            echo "Configuration seule : rien a construire, on deploie l image en place."
            echo "deployer=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: verifier-course
    if: ${{ needs.verifier-course.outputs.deployer == 'true' && (!github.event.workflow_run || github.event.workflow_run.conclusion == 'success') }}
    environment: PRD
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer les contenus des fichiers
        id: prepare
        run: |
          # Lire le contenu du docker-compose.yml
          COMPOSE_CONTENT=$(cat docker-compose.yml | base64 -w 0)
          echo "compose_content=$COMPOSE_CONTENT" >> $GITHUB_OUTPUT

          # Lire le contenu du nginx.conf
          NGINX_CONTENT=$(cat nginx/nginx.conf | base64 -w 0)
          echo "nginx_content=$NGINX_CONTENT" >> $GITHUB_OUTPUT

          # Observability configs (loki, vector, grafana provisioning) as a tarball.
          OBS_CONTENT=$(tar czf - observability | base64 -w 0)
          echo "obs_content=$OBS_CONTENT" >> $GITHUB_OUTPUT

      # Absorb transient runner→VPS network blips (the last failure was
      # `dial tcp <vps>:22: i/o timeout`, i.e. the SSH action couldn't even
      # open the socket). Poll TCP/22 until it answers before attempting the
      # real SSH deploy, so a brief blip doesn't fail the whole run.
      - name: Wait for VPS SSH to be reachable
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        # Le port 22 n'est filtré NI par le VPS (pas de fail2ban, ufw inactif,
        # iptables/nftables sans règle sur 22, conntrack à 59/262144) NI par
        # sshd : lors de l'échec du 2026-08-11, sshd n'a rien journalisé entre
        # 16:24 (déploiement manuel réussi) et 16:42. Les paquets SYN du runner
        # n'atteignaient pas la machine — filtrage en amont, côté hébergeur ou
        # sur le chemin depuis les plages GitHub, et propre à l'IP du runner :
        # un autre runner s'était connecté huit minutes plus tôt.
        #
        # Rien à corriger côté serveur : on attend simplement que ça passe.
        # 2,5 minutes ne suffisaient pas (échecs des 2026-08-09 et 2026-08-11) ;
        # 10 minutes couvrent ces deux épisodes, le job SSH qui suit ayant de
        # toute façon son propre timeout.
        run: |
          ATTEMPTS=40
          DELAY=15
          for i in $(seq 1 $ATTEMPTS); do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$VPS_HOST/$VPS_PORT" 2>/dev/null; then
              echo "VPS $VPS_HOST:$VPS_PORT reachable (attempt $i)."
              exit 0
            fi
            # Une ligne toutes les minutes : le journal reste lisible.
            if [ $((i % 4)) -eq 1 ]; then
              echo "Attempt $i/$ATTEMPTS: $VPS_HOST:$VPS_PORT not reachable yet, still retrying…"
            fi
            sleep $DELAY
          done
          echo "::error::VPS $VPS_HOST:$VPS_PORT unreachable after $ATTEMPTS attempts (~10 min). Le VPS répond-il en HTTPS ? Si oui, le filtrage est en amont (hébergeur / chemin réseau) : relancer le job suffit en général."
          exit 1

      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          COMPOSE_CONTENT: ${{ steps.prepare.outputs.compose_content }}
          NGINX_CONTENT: ${{ steps.prepare.outputs.nginx_content }}
          OBS_CONTENT: ${{ steps.prepare.outputs.obs_content }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: COMPOSE_CONTENT,NGINX_CONTENT,OBS_CONTENT
          # `timeout` = SSH connection-establishment timeout (only real knobs
          # appleboy/ssh-action@v1.0.0 exposes are `timeout` + `command_timeout`;
          # there is no native connect-retry). The "Wait for VPS SSH" step
          # above absorbs transient `dial tcp <vps>:22: i/o timeout` blips
          # before we get here.
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            DEPLOY_DIR=/root/edukia
            PRIMARY_DOMAIN=educ-prime.com
            CERT_EMAIL=support@educ-prime.cloud

            # Créer le répertoire de déploiement
            mkdir -p "$DEPLOY_DIR/backend/config"
            mkdir -p "$DEPLOY_DIR/nginx"
            mkdir -p "$DEPLOY_DIR/certbot/conf"
            mkdir -p "$DEPLOY_DIR/certbot/www"
            cd "$DEPLOY_DIR"

            # Créer le fichier .env avec les secrets
            cat > .env << 'ENV_EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
            DOCKER_IMAGE_BACKEND=ghcr.io/dkayode/edukia-backend:latest
            DOCKER_IMAGE_FRONTEND=ghcr.io/dkayode/edukia-frontend:latest
            PORT=3000
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            REDIS_HOST=redis
            REDIS_PORT=6379
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_PUBLIC_BUCKET=${{ secrets.R2_PUBLIC_BUCKET }}
            R2_PUBLIC_BUCKET_URL=${{ secrets.R2_PUBLIC_BUCKET_URL }}
            PAYMENT_INTERNAL_API_KEY=${{ secrets.PAYMENT_INTERNAL_API_KEY }}
            # Wallet OTP — sensitive (set in the PRD GitHub environment secrets)
            OTP_HASH_SECRET=${{ secrets.OTP_HASH_SECRET }}
            INFOBIP_BASE_URL=${{ secrets.INFOBIP_BASE_URL }}
            INFOBIP_API_KEY=${{ secrets.INFOBIP_API_KEY }}
            INFOBIP_FROM=${{ secrets.INFOBIP_FROM }}
            INFOBIP_WEBHOOK_SECRET=${{ secrets.INFOBIP_WEBHOOK_SECRET }}
            # Wallet OTP — non-sensitive config, set literally here (not secrets).
            # OTP_SMS_PROVIDER=infobip + OTP_DEBUG_ENABLED=false are the prod
            # values (test.txt ships console/true for local dev only).
            OTP_SMS_PROVIDER=infobip
            OTP_DEBUG_ENABLED=false
            OTP_TTL_MINUTES=10
            OTP_LENGTH=6
            OTP_MAX_ATTEMPTS=3
            OTP_RESEND_COOLDOWN_SECONDS=60
            OTP_MAX_RESENDS=2
            OTP_LOCK_DURATION_MINUTES=1440
            OTP_ANDROID_SMS_HASH=omRcRPVzgWL
            INFOBIP_SMS_ENDPOINT=/sms/2/text/advanced
            INFOBIP_TIMEOUT_MS=10000
            INFOBIP_REPORTS_ENDPOINT=/sms/1/reports
            INFOBIP_REMOVE_PLUS_FROM_TO=true
            INFOBIP_DELIVERY_REPORT_NOTIFY_URL=
            INFOBIP_NOTIFY_CONTENT_TYPE=application/json
            GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
            SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
            # Kessiah — lecture automatique des épreuves. Les deux valeurs vont
            # de pair : il suffit qu'une seule manque pour que l'intégration se
            # désactive d'elle-même, sans erreur ni appel sortant.
            KESSIAH_API_BASE_URL=${{ secrets.KESSIAH_API_BASE_URL }}
            KESSIAH_SERVICE_KEY=${{ secrets.KESSIAH_SERVICE_KEY }}
            ENV_EOF

            # Créer le fichier docker-compose.yml depuis le contenu du repo
            echo "$COMPOSE_CONTENT" | base64 -d > docker-compose.yml

            # Créer le fichier nginx.conf depuis le contenu du repo
            echo "$NGINX_CONTENT" | base64 -d > ./nginx/nginx.conf

            # Extraire les configs d'observabilité (loki, vector, grafana).
            echo "$OBS_CONTENT" | base64 -d | tar xzf - -C "$DEPLOY_DIR"

            # Use Docker Compose v2 (the Go plugin, invoked as `docker compose`).
            # The legacy v1 Python binary (`docker-compose`, 1.29.2) crashes with
            # `KeyError: 'ContainerConfig'` against modern Docker engines that
            # stopped emitting that field. Install the plugin if it's missing.
            if ! docker compose version >/dev/null 2>&1; then
              echo "=== Installation du plugin docker compose v2"
              apt-get update -qq
              apt-get install -y -qq docker-compose-plugin
            fi
            COMPOSE="docker compose"

            # Sweep leftover hash-prefixed containers from previous failed
            # v1 recreate attempts (e.g. 1ab776779dd5_edukia_certbot). They
            # block v2 from cleanly creating the real names.
            docker ps -a --format '{{.Names}}' \
              | grep -E '^[0-9a-f]{12}_edukia_' \
              | xargs -r docker rm -f || true

            # Bootstrap Let's Encrypt: si aucun certificat n'existe pour le
            # domaine, créer un certificat auto-signé temporaire pour que
            # nginx puisse démarrer. Sinon le challenge HTTP-01 est bloqué
            # par le fait que nginx refuse de démarrer sans certificat.
            CERT_DIR="$DEPLOY_DIR/certbot/conf/live/$PRIMARY_DOMAIN"
            BOOTSTRAP_NEEDED=0
            if [ ! -s "$CERT_DIR/fullchain.pem" ]; then
              echo "=== Aucun certificat trouvé pour $PRIMARY_DOMAIN — création d'un dummy"
              mkdir -p "$CERT_DIR"
              timeout 300 docker run --rm \
                -v "$DEPLOY_DIR/certbot/conf:/etc/letsencrypt" \
                --entrypoint openssl certbot/certbot \
                req -x509 -nodes -newkey rsa:4096 -days 1 \
                -keyout "/etc/letsencrypt/live/$PRIMARY_DOMAIN/privkey.pem" \
                -out "/etc/letsencrypt/live/$PRIMARY_DOMAIN/fullchain.pem" \
                -subj "/CN=localhost" </dev/null
              BOOTSTRAP_NEEDED=1
            fi

            # Same bootstrap for grafana's OWN certificate lineage. Grafana has a
            # separate cert (NOT a SAN on the educ-prime.com cert) so issuing/
            # renewing it never re-keys the api cert — that re-key broke the
            # mobile app's certificate pinning.
            GRAFANA_CERT_DIR="$DEPLOY_DIR/certbot/conf/live/grafana.$PRIMARY_DOMAIN"
            GRAFANA_BOOTSTRAP_NEEDED=0
            if [ ! -s "$GRAFANA_CERT_DIR/fullchain.pem" ]; then
              echo "=== Aucun certificat pour grafana.$PRIMARY_DOMAIN — création d'un dummy"
              mkdir -p "$GRAFANA_CERT_DIR"
              timeout 300 docker run --rm \
                -v "$DEPLOY_DIR/certbot/conf:/etc/letsencrypt" \
                --entrypoint openssl certbot/certbot \
                req -x509 -nodes -newkey rsa:4096 -days 1 \
                -keyout "/etc/letsencrypt/live/grafana.$PRIMARY_DOMAIN/privkey.pem" \
                -out "/etc/letsencrypt/live/grafana.$PRIMARY_DOMAIN/fullchain.pem" \
                -subj "/CN=grafana.$PRIMARY_DOMAIN" </dev/null
              GRAFANA_BOOTSTRAP_NEEDED=1
            fi

            # Every docker invocation below is wrapped in `timeout` and fed
            # </dev/null. Root cause of the recurring "Run Command Timeout":
            # `docker compose logs` (and occasionally pull/up) can block
            # indefinitely against the SSH session, so the action waits out the
            # full command_timeout. Bounding each call means a stuck step is
            # killed in seconds and the script proceeds to its clean `exit 0`,
            # rather than the whole job hanging ~20 min and failing.

            # Arrêter les conteneurs applicatifs (laisser db, redis, certbot, nginx)
            timeout 120 $COMPOSE stop backend frontend </dev/null || true
            timeout 60  $COMPOSE rm -f backend frontend </dev/null || true

            # Pull les dernières images (le plus lent — large timeout).
            timeout 900 $COMPOSE pull backend frontend redis </dev/null

            # Démarrer la pile (nginx avec dummy cert si nécessaire).
            timeout 300 $COMPOSE up -d --remove-orphans </dev/null >/dev/null 2>&1

            # Si on a démarré avec un dummy cert, demander un vrai certificat
            # à Let's Encrypt via webroot (nginx est maintenant up sur le 80).
            if [ "$BOOTSTRAP_NEEDED" = "1" ]; then
              echo "=== Suppression du dummy cert et émission du vrai certificat"
              timeout 60 docker run --rm \
                -v "$DEPLOY_DIR/certbot/conf:/etc/letsencrypt" \
                --entrypoint sh certbot/certbot \
                -c "rm -rf /etc/letsencrypt/live/$PRIMARY_DOMAIN /etc/letsencrypt/archive/$PRIMARY_DOMAIN /etc/letsencrypt/renewal/$PRIMARY_DOMAIN.conf" </dev/null || true

              timeout 180 docker run --rm \
                -v "$DEPLOY_DIR/certbot/conf:/etc/letsencrypt" \
                -v "$DEPLOY_DIR/certbot/www:/var/www/certbot" \
                certbot/certbot certonly --webroot \
                  --webroot-path=/var/www/certbot \
                  --email "$CERT_EMAIL" --agree-tos --no-eff-email \
                  --rsa-key-size 4096 --reuse-key \
                  -d "$PRIMARY_DOMAIN" -d "api.$PRIMARY_DOMAIN" </dev/null || true

              # Recharger nginx avec le vrai certificat
              timeout 30 $COMPOSE exec -T nginx nginx -s reload </dev/null >/dev/null 2>&1 || true
            fi

            # Issue grafana's SEPARATE certificate (own lineage, --cert-name
            # grafana.educ-prime.com) when we just bootstrapped a dummy for it.
            # Kept isolated from the api cert on purpose: grafana renewals must
            # never re-key educ-prime.com/api.educ-prime.com. Requires a DNS A
            # record for grafana.$PRIMARY_DOMAIN; guarded so a slow record never
            # fails the deploy (nginx keeps serving the dummy until it succeeds).
            if [ "$GRAFANA_BOOTSTRAP_NEEDED" = "1" ]; then
              echo "=== Émission du certificat séparé pour grafana.$PRIMARY_DOMAIN"
              timeout 60 docker run --rm \
                -v "$DEPLOY_DIR/certbot/conf:/etc/letsencrypt" \
                --entrypoint sh certbot/certbot \
                -c "rm -rf /etc/letsencrypt/live/grafana.$PRIMARY_DOMAIN /etc/letsencrypt/archive/grafana.$PRIMARY_DOMAIN /etc/letsencrypt/renewal/grafana.$PRIMARY_DOMAIN.conf" </dev/null || true
              timeout 180 docker run --rm \
                -v "$DEPLOY_DIR/certbot/conf:/etc/letsencrypt" \
                -v "$DEPLOY_DIR/certbot/www:/var/www/certbot" \
                certbot/certbot certonly --webroot \
                  --webroot-path=/var/www/certbot \
                  --email "$CERT_EMAIL" --agree-tos --no-eff-email \
                  --rsa-key-size 4096 --reuse-key \
                  --cert-name "grafana.$PRIMARY_DOMAIN" \
                  -d "grafana.$PRIMARY_DOMAIN" </dev/null || true
              timeout 30 $COMPOSE exec -T nginx nginx -s reload </dev/null >/dev/null 2>&1 || true
            fi

            # Recharger nginx pour prendre en compte d'éventuels changements
            # de configuration. On ne fail pas si nginx n'est pas up.
            timeout 30 $COMPOSE exec -T nginx nginx -s reload </dev/null >/dev/null 2>&1 || true

            # Attendre un peu pour que les conteneurs démarrent
            sleep 10

            # Diagnostic. Use plain `docker ps`/`docker logs` (never follow) and
            # bound them with `timeout` so a stuck container log can't hang the
            # SSH session. `|| true` so diagnostics never fail the deploy.
            echo "=== Container status ==="
            timeout 30 docker ps --filter name=edukia_ --format 'table {{.Names}}\t{{.Status}}' </dev/null || true

            echo "=== Backend logs ==="
            timeout 20 docker logs edukia_backend --tail 50 </dev/null 2>&1 || true
            echo "=== Nginx logs ==="
            timeout 20 docker logs edukia_nginx --tail 20 </dev/null 2>&1 || true

            # Explicit success marker + exit 0 so the SSH command returns a
            # clean status immediately after the last diagnostic.
            echo "=== Deploy script finished ==="
            exit 0

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
